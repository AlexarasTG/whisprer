name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Select which semantic version to increment"
        required: true
        default: minor
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  prepare-release:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Load release configuration
        run: |
          set -a
          . scripts/release/release.env
          set +a

          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "Release workflow must be run from a branch." >&2
            exit 1
          fi

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "Release workflow must be run from ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          chmod +x scripts/release/get_next_version.sh scripts/release/update_xcode_version.sh
          VERSION="$(scripts/release/get_next_version.sh "${{ inputs.version_bump }}" "${APP_PROJECT_FILE}")"
          TAG_NAME="v${VERSION}"
          RELEASE_BRANCH="release/${TAG_NAME}"

          {
            echo "VERSION=${VERSION}"
            echo "TAG_NAME=${TAG_NAME}"
            echo "RELEASE_BRANCH=${RELEASE_BRANCH}"
          } >> "${GITHUB_ENV}"

      - name: Create release branch and pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -a
          . scripts/release/release.env
          set +a

          scripts/release/update_xcode_version.sh "${VERSION}" "${APP_PROJECT_FILE}"

          if git diff --quiet -- "${APP_PROJECT_FILE}"; then
            echo "Release version ${VERSION} is already present in ${APP_PROJECT_FILE}" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists on origin." >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            echo "Release branch ${RELEASE_BRANCH} already exists on origin." >&2
            exit 1
          fi

          if [ -n "$(gh pr list --head "${RELEASE_BRANCH}" --json number --jq '.[0].number')" ]; then
            echo "A pull request for ${RELEASE_BRANCH} already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${RELEASE_BRANCH}"
          git add "${APP_PROJECT_FILE}"
          git commit -m "Release ${TAG_NAME}"
          git push origin "HEAD:${RELEASE_BRANCH}"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${RELEASE_BRANCH}" \
            --title "Release ${TAG_NAME}" \
            --body "Automated release PR for ${TAG_NAME}. Merge this PR to publish the GitHub Release artifact."
